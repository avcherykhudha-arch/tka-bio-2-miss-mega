<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="120" fill="url(#pinkGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#fecdd3" stroke-width="6" opacity="0.4"/>
  
  <!-- Central emblem circle -->
  <circle cx="256" cy="256" r="180" fill="url(#cardGrad)" filter="drop-shadow(0 12px 24px rgba(159,18,57,0.3))"/>
  
  <!-- DNA Double Helix and Plant Sprout & Microscope -->
  <g transform="translate(146, 126) scale(0.43)">
    <!-- DNA Strands -->
    <path d="M120 80 Q256 180 392 80 Q528 -20 528 80 Q528 180 392 280 Q256 380 120 280" fill="none" stroke="#f43f5e" stroke-width="28" stroke-linecap="round"/>
    <path d="M120 280 Q256 180 392 280 Q528 380 528 280 Q528 180 392 80 Q256 -20 120 80" fill="none" stroke="#a855f7" stroke-width="28" stroke-linecap="round"/>
    <!-- Connecting rungs -->
    <line x1="180" y1="120" x2="180" y2="240" stroke="#fda4af" stroke-width="18" stroke-linecap="round"/>
    <line x1="256" y1="180" x2="256" y2="180" stroke="#fb7185" stroke-width="22" stroke-linecap="round"/>
    <line x1="332" y1="120" x2="332" y2="240" stroke="#c084fc" stroke-width="18" stroke-linecap="round"/>
    <line x1="432" y1="100" x2="432" y2="260" stroke="#f43f5e" stroke-width="18" stroke-linecap="round"/>
    <!-- Base pair dots -->
    <circle cx="180" cy="120" r="16" fill="#f43f5e"/>
    <circle cx="180" cy="240" r="16" fill="#a855f7"/>
    <circle cx="332" cy="120" r="16" fill="#a855f7"/>
    <circle cx="332" cy="240" r="16" fill="#f43f5e"/>
    <circle cx="432" cy="100" r="16" fill="#f43f5e"/>
    <circle cx="432" cy="260" r="16" fill="#a855f7"/>
    <!-- Leaf / Life symbol -->
    <path d="M256 340 C210 390 200 470 256 500 C312 470 302 390 256 340 Z" fill="#10b981"/>
    <path d="M256 370 L256 470" stroke="#059669" stroke-width="10" stroke-linecap="round"/>
    <circle cx="256" cy="500" r="18" fill="#ec4899"/>
  </g>
  
  <!-- Text Badge -->
  <rect x="136" y="380" width="240" height="54" rx="27" fill="url(#purpleGlow)"/>
  <text x="256" y="416" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">BIO 2026</text>
</svg>
